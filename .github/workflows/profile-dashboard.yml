name: Generate Profile Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "github_profile_card_jihad (1).png"
      - "scripts/generate_terminal_banner.py"
      - ".github/workflows/profile-dashboard.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate terminal dither banners
        run: python scripts/generate_terminal_banner.py

      - name: Commit generated banners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-dark.svg assets/banner-light.svg
          git diff --cached --quiet || git commit -m "Update terminal profile banners"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "Failed to push banners after retries"
          exit 1
