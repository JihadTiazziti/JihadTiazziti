name: Generate Profile Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "github_profile_card_jihad (1).png"
      - "scripts/generate_dashboard.py"
      - ".github/workflows/profile-dashboard.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate cyber dashboard
        run: python scripts/generate_dashboard.py

      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-dashboard.png
          git diff --cached --quiet || git commit -m "Update profile dashboard"
          git push
